[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-chats"
version = "0.1.0"
description = "Pipeline local de ingest, embeddings y busqueda MCP para conversaciones web con LLMs"
requires-python = ">=3.13"
dependencies = [
    "fastembed>=0.8",
    "mcp>=2.0",
    "numpy>=2.0",
    "sqlite-vec>=0.1.6",
]

[dependency-groups]
dev = ["mypy>=1.13", "pytest>=8", "ruff>=0.8"]

[tool.hatch.build.targets.wheel]
packages = ["ai_chats"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["ai_chats", "tests"]

[[tool.mypy.overrides]]
module = ["sqlite_vec", "sqlite_vec.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
