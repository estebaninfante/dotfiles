<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1f29"/>
      <stop offset="1" stop-color="#0b0d12"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7d95"/>
      <stop offset="1" stop-color="#e02c50"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ff0d8"/>
      <stop offset="1" stop-color="#3fbfa0"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="124" height="124" rx="26" fill="url(#bg)"/>
  <rect x="2.5" y="2.5" width="123" height="123" rx="25.5" fill="none" stroke="#ffffff14"/>

  <!-- tira de película -->
  <rect x="14" y="30" width="100" height="68" rx="7" fill="#0e1117" stroke="#2a3040"/>
  <!-- perforaciones -->
  <g fill="#ffffff22">
    <rect x="20" y="35" width="7" height="5" rx="1.5"/>
    <rect x="32" y="35" width="7" height="5" rx="1.5"/>
    <rect x="44" y="35" width="7" height="5" rx="1.5"/>
    <rect x="56" y="35" width="7" height="5" rx="1.5"/>
    <rect x="68" y="35" width="7" height="5" rx="1.5"/>
    <rect x="80" y="35" width="7" height="5" rx="1.5"/>
    <rect x="92" y="35" width="7" height="5" rx="1.5"/>
    <rect x="104" y="35" width="4" height="5" rx="1.5"/>
    <rect x="20" y="88" width="7" height="5" rx="1.5"/>
    <rect x="32" y="88" width="7" height="5" rx="1.5"/>
    <rect x="44" y="88" width="7" height="5" rx="1.5"/>
    <rect x="56" y="88" width="7" height="5" rx="1.5"/>
    <rect x="68" y="88" width="7" height="5" rx="1.5"/>
    <rect x="80" y="88" width="7" height="5" rx="1.5"/>
    <rect x="92" y="88" width="7" height="5" rx="1.5"/>
    <rect x="104" y="88" width="4" height="5" rx="1.5"/>
  </g>

  <!-- tres cuadros: corto, largo, corto -->
  <rect x="21" y="45" width="20" height="38" rx="2.5" fill="url(#pink)" opacity=".85"/>
  <rect x="46" y="45" width="36" height="38" rx="2.5" fill="#0a0c11" stroke="#ffffff2e"/>
  <rect x="87" y="45" width="21" height="38" rx="2.5" fill="url(#mint)" opacity=".8"/>

  <!-- play en el cuadro del medio -->
  <path d="M59 54 L59 74 L75 64 Z" fill="#ffffff" opacity=".95"/>
</svg>
