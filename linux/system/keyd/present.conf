# Control remoto de presentaciones SHARKOON "Wireless Present" (USB 1ea7:1068).
#
# Interfaz teclado (hidraw2 / event23). Botones observados, como usos HID:
#   - HID 0x50 -> flecha izquierda  (diapositiva anterior / Page Up)
#   - HID 0x4f -> flecha derecha    (diapositiva siguiente / Page Down)
#   - HID 0x2b -> Tab               (boton "extra": pantalla negra/otro)
#   - 4to boton fisico: puntero laser (no emite evento USB)
#
# El boton Tab se reasigna a F13: voice-key-listener lo usa para disparar
# OmniVoz (push-to-talk) sin decir la palabra clave. Las flechas se dejan
# intactas para seguir pasando diapositivas.
#
# Nota: la id 1ea7:1068 esta excluida en default.conf para que no la tome
# tambien la config global (keyd admite cada dispositivo en un solo archivo).
[ids]
1ea7:1068

[main]
tab = f13
