# Control remoto de presentaciones SHARKOON "Wireless Present" (USB 1ea7:1068).
#
# Interfaz teclado (hidraw2 / event23). Botones observados, como usos HID:
#   - HID 0x50 -> flecha izquierda  (diapositiva anterior)
#   - HID 0x4f -> flecha derecha    (diapositiva siguiente)
#   - HID 0x2b -> Tab               (boton "extra")
#   - 4to boton fisico: puntero laser (no emite evento USB)
#
# Los botones se remapean a teclas dedicadas (F14/F15/F16) para que el listener
# `present-remote` les de comportamiento contextual, sin pisar al teclado real:
#
#   F14  boton extra (Tab)   mantener -> Handy (dictado)   tocar -> Omar (voz)
#   F15  flecha izquierda    terminal -> ventana tmux previa | otro -> scroll arriba
#   F16  flecha derecha      terminal -> ventana tmux próxima | otro -> scroll abajo
#
# Ver `present-remote` y CONTROL-REMOTO.md (repo voz-agentes) para el detalle.
#
# Nota: la id 1ea7:1068 esta excluida en default.conf para que no la tome
# tambien la config global (keyd admite cada dispositivo en un solo archivo).
[ids]
1ea7:1068

[main]
tab = f14
left = f15
right = f16
