[ids]
*

[main]
# Caps Lock como Super (keyd, no XKB): aplica en TTY/GDM y toda sesion.
capslock = leftmeta
# overload(numpad, layer(alt)): tap = alt, hold = numpad layer.
# layer(alt) en vez de leftalt evita el warning de keyd y preserva Alt en tap.
leftalt = overload(numpad, layer(alt))
enter = overload(nav, enter)
# Chording: space+AltGr (rightalt) = escape, sin sacrificar space.
space+rightalt = escape
middlemouse = f7

[nav]
a = left
s = left
d = down
f = right
e = up

[numpad]
# Operadores
a = kpplus
s = kpminus
d = kpasterisk
f = kpslash
g = kpequal
p = kpequal

# Números
m = 1
comma = 2
dot = 3
j = 4
k = 5
l = 6
u = 7
i = 8
o = 9
semicolon = 0

# Capa compuesta: garantiza Ctrl+Alt+F1..F12 (cambio de TTY) aunque leftalt
# tenga overload(numpad). Al sostener leftalt se activa numpad (no alt);
# esta compuesta con control re-emite ctrl+alt+F<N> con precedencia.
# DEBE ir despues de las capas base (numpad).
[control+numpad]
f1 = C-A-f1
f2 = C-A-f2
f3 = C-A-f3
f4 = C-A-f4
f5 = C-A-f5
f6 = C-A-f6
f7 = C-A-f7
f8 = C-A-f8
f9 = C-A-f9
f10 = C-A-f10
f11 = C-A-f11
f12 = C-A-f12

# Workspaces tmux: ctrl+alt + letra (posicion dvorak de las letras de
# workspace de hyprland: M W V H T N G C R S -> 1-10) re-emite ctrl+N
# (la capa numpad traga los modificadores, igual que los F-keys).
# tmux los bindea como C-1..C-0 (linux/config/tmux/tmux.conf).
m = C-1
comma = C-2
dot = C-3
j = C-4
k = C-5
l = C-6
u = C-7
i = C-8
o = C-9
semicolon = C-0
