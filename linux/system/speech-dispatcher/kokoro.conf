# Módulo genérico de Speech Dispatcher que expone Kokoro local como voces
# en-US para el "Read Aloud" de Zotero (sin cuenta ni internet).
#
# @HOME@ lo reemplaza scripts/setup-kokoro-reader.sh por el home real de la
# máquina al instalar el archivo en /etc/speech-dispatcher/modules/kokoro.conf.
Debug 0

GenericExecuteSynth "printf '%s' '$DATA' | @HOME@/.local/bin/kokoro-speechd --voice '$VOICE' --rate $RATE --volume $VOLUME"

AddVoice "en-US" "MALE1"   "Kokoro Liam"
AddVoice "en-US" "MALE2"   "Kokoro Puck"
AddVoice "en-US" "MALE3"   "Kokoro Fable"
AddVoice "en-US" "FEMALE1" "Kokoro Heart"
