# Drop-in versionado por dotfiles: reemplaza el watcher de Omarchy por el
# autodiagnóstico, sin tocar /usr/share/omarchy (que se pisa en cada update).
# El resto del unit (ConditionPathExists del toggle, PartOf, Restart) se
# conserva; solo cambiamos el comando.
[Service]
ExecStart=
ExecStart=%h/.local/bin/omarchy-crash-autodiagnose
