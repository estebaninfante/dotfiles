# Reverse path "loose": la laptop tiene ethernet (dock USB) y WiFi en el
# mismo subnet 192.168.1.0/24. Con rp_filter estricto el kernel dropea las
# respuestas del peer KVM que entran por la interfaz no-preferida (el cable
# y el WiFi comparten L2), rompiendo el handshake DTLS de lan-mouse.
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2
