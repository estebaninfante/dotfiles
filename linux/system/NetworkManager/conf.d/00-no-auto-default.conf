# Este portátil no tiene NIC cableada, así que la única "ethernet" que aparece
# es la del gadget USB del Kindle. NetworkManager creaba perfiles por defecto
# ("Wired connection N") para esos netdevs y los autoactivaba con DHCP: al
# conectar el Kindle, el enlace USB se llevaba la conexión (y con el segundo
# netdev del gadget, también la ruta por defecto).
#
# no-auto-default=* prohíbe crear perfiles cableados automáticos. kindle-usbnet
# (USBNetwork) es explícito y con autoconnect=no: solo se levanta a mano con
# `nmcli connection up kindle-usbnet` cuando se necesita esa red; un dongle USB
# nuevo habría que configurarlo igual, a mano.
[main]
no-auto-default=*
