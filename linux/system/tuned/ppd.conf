# Configuracion tuned-ppd (API PowerProfiles)
# Mapeo de perfiles PPD -> perfiles tuned segun fuente de alimentacion.
# Destino: /etc/tuned/ppd.conf (requiere sudo, ver scripts/install.sh)

[main]
default=balanced
battery_detection=true
sysfs_acpi_monitor=true

[profiles]
power-saver=powersave
balanced=balanced
performance=throughput-performance

[battery]
# En bateria: balanced sesgado a ahorro.
balanced=balanced-battery

[ac]
# Enchufado: power-saver sigue usable, no powersave puro.
power-saver=balanced-battery
