[bar]
background       = "#000000"
background-alpha = 1.0

[font]
base-size = 11

[menu]
scrim-alpha = 0.0
background-alpha = 1.0

# Flotantes sin transparencia: paneles, tooltips y notificaciones con fondo
# sólido.
[popups]
background-alpha = 1.0

[tooltip]
background-alpha = 1.0

# Notificaciones: fondo negro sólido y sin delineado.
# `border-width = 0` es lo que apaga el outline (Border.surfaceSpec de
# omarchy.notifications usa este ancho, con fallback a 1-2px).
[notifications]
background       = "#000000"
background-alpha = 1.0
border-width     = 0

