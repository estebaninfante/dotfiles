# Tema OSCURO (noche) — guía legibilidad
# Gris oscuro cálido, nunca negro puro. Texto suave, no blanco puro.
# Evita halation del astigmatismo en baja luz (fondo no brilla).
# ══════════════════════════════════════════════════════════

