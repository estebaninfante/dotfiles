# ══════════════════════════════════════════════════════════
# Tema CLARO — guía legibilidad (miopía + astigmatismo, luz blanca)
# Modo claro: pupila contraída, sin halation del astigmatismo.
# Crema cálido (no blanco puro) evita deslumbramiento con bombillo frío.
# ══════════════════════════════════════════════════════════

# Fondo crema suave / texto gris muy oscuro (nunca negro puro ni blanco puro)
background            #fdf8f0
foreground            #1a1a18

# Selección (gris cálido neutro)
selection_foreground  #1a1a18
selection_background  #e0dacf

# Paleta — colores OSCUROS sobre fondo claro (legibilidad)

# black
color0                #33332f
color8                #76766f

# red
color1                #b72500
color9                #d41919

# green (desaturado — reduce glare)
color2                #3a6a4a
color10               #4a7a5a

# yellow (ámbar oscuro, no amarillo puro sobre crema)
color3                #a4690e
color11               #c98a1b

# blue (desaturado cálido — reduce halation del astigmatismo)
color4                #2a5a6e
color12               #3a6a7a

# magenta
color5                #ab2e63
color13               #c94f88

# cyan (desaturado cálido — reduce halation)
color6                #2a6a6e
color14               #3a7a7a

# white (en tema claro: grises medios/oscuros)
color7                #56565e
color15               #23231f

# Cursor y bordes — neutros
cursor                #1a1a18
active_border_color   #55554d
inactive_border_color #d9d2c4
url_color             #2a5a6e
