## ╔══════════════════════════════════════════════════════╗
## ║  kitty.conf — NixOS (Linux)                        ║
## ║  ctrl+shift = kitty_mod (default)                  ║
## ╚══════════════════════════════════════════════════════╝

include active-theme.conf

# ── General ────────────────────────────────────────────────
shell                           tmux
confirm_os_window_close          0
copy_on_select                   yes
scrollback_lines                 10000
enable_audio_bell                no
visual_bell_duration             0.0

# ── Window appearance ──────────────────────────────────────
window_padding_width             6 10 6 10
hide_window_decorations          titlebar-only
background_opacity               1
dim_opacity                      0.75
background_blur                  5

# ── Cursor ─────────────────────────────────────────────────
cursor_shape                     beam
cursor_blink_interval            0
shell_integration                enabled
cursor_trail                     20
cursor_trail_decay               0.9 0.9
mouse_hide_wait                  3

# ── Font ───────────────────────────────────────────────────
font_family                      JetBrainsMono Nerd Font Mono
bold_font                        JetBrainsMono Nerd Font Mono Bold
italic_font                      JetBrainsMono Nerd Font Mono Italic
bold_italic_font                 JetBrainsMono Nerd Font Mono Bold Italic
font_size                        16
disable_ligatures                always
modify_font                      cell_height 112%

# ── Tab bar ────────────────────────────────────────────────
tab_bar_style                    powerline
tab_powerline_style              round
tab_bar_edge                     top
tab_bar_align                    left
tab_bar_min_tabs                 1
tab_title_template               "{index}: {title}"
active_tab_title_template       "{index}: {bell_symbol}{activity_symbol}{title}"

# ── Tab management (ctrl+shift) ────────────────────────────
# C-Tab/C-S-Tab: kitty 0.48 los roba por default (next_tab/previous_tab,
# definition.py:4003/4017). `map clave` con acción vacía = desmapear, pero
# kitty NO re-encodea ctrl+tab (encoding legacy 0x09, modifyOtherKeys no
# toca teclas con legacy) -> tmux recibiría TAB pelado. send_text envía
# los bytes CSI explícitos que tmux (extended-keys) parsea como C-Tab.
map ctrl+tab                      send_text all \x1b[27;5;9~
map ctrl+shift+tab                send_text all \x1b[27;6;9~
map ctrl+shift+t                 new_tab
map ctrl+shift+w                 close_tab
map ctrl+shift+]                 next_tab
map ctrl+shift+[                 previous_tab
map ctrl+shift+alt+t             set_tab_title
map ctrl+shift+1                 goto_tab 1
map ctrl+shift+2                 goto_tab 2
map ctrl+shift+3                 goto_tab 3
map ctrl+shift+4                 goto_tab 4
map ctrl+shift+5                 goto_tab 5
map ctrl+shift+6                 goto_tab 6
map ctrl+shift+7                 goto_tab 7
map ctrl+shift+8                 goto_tab 8
map ctrl+shift+9                 goto_tab 9

# ── Window / split management ──────────────────────────────
map ctrl+shift+enter             new_window
map ctrl+shift+e                 new_window_with_cwd
map ctrl+shift+q                 close_window
map ctrl+shift+l                 next_layout
map ctrl+shift+z                 toggle_layout stack
map ctrl+shift+p                 toggle_window_state fullscreen

# ── Navigate between windows/splits ────────────────────────
map ctrl+shift+h                 neighboring_window left
map ctrl+shift+j                 neighboring_window down
map ctrl+shift+k                 neighboring_window up
map ctrl+shift+l                 neighboring_window right

# ── Move windows in layout ─────────────────────────────────
map ctrl+shift+alt+h             swap_window left
map ctrl+shift+alt+j             swap_window down
map ctrl+shift+alt+k             swap_window up
map ctrl+shift+alt+l             swap_window right

# ── Resize splits ──────────────────────────────────────────
map ctrl+shift+left              resize_window narrower 3
map ctrl+shift+right             resize_window wider 3
map ctrl+shift+up                resize_window taller 3
map ctrl+shift+down              resize_window shorter 3
map ctrl+shift+equal             resize_window reset

# ── Tema día/noche (legibilidad) ───────────────────────────
map ctrl+shift+f9                launch --type=background sh -c "~/.local/bin/kitty-theme-toggle.sh toggle"
map ctrl+shift+f10               launch --type=background sh -c "~/.local/bin/obsidian-theme-toggle.sh toggle"

# ── Misc ───────────────────────────────────────────────────
map ctrl+z                        send_text normal \x1a
map ctrl+q                        send_text normal \x11

# ── Scrolling ──────────────────────────────────────────────
map ctrl+shift+page_up           scroll_line_up
map ctrl+shift+page_down         scroll_line_down
map ctrl+shift+home              scroll_home
map ctrl+shift+end               scroll_end
map ctrl+shift+u                 scroll_page_up
map ctrl+shift+d                 scroll_page_down

# ── Delete word (ctrl+backspace / ctrl+delete) ─────────────
map ctrl+backspace               send_text normal \x17
map ctrl+delete                  send_text normal \x1b[3;5~

# ── Clipboard ──────────────────────────────────────────────
map ctrl+shift+c                 copy_to_clipboard
map ctrl+shift+v                 paste_from_clipboard
map ctrl+shift+s                 paste_from_selection
map ctrl+shift+o                 open_url_with_hints
map ctrl+shift+c>ctrl+c          clipboard_to_stdout
