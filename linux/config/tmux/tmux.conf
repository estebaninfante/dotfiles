set -g base-index 1
setw -g pane-base-index 1

# ── Keybinds estilo browser/Warp (sin prefix) ──
# Ctrl+n nueva tab · Ctrl+Tab siguiente · Ctrl+Shift+Tab anterior
# Ctrl+Tab solo llega al tmux si la terminal externa lo envia:
# requiere extended-keys (kitty y xterm con modifyOtherKeys lo soportan).
set -g extended-keys on
set -as terminal-features '*:extkeys'
bind -n C-n new-window
bind -n C-Tab next-window
bind -n C-S-Tab previous-window

# Al cerrar una tab, renumerar el resto
set -g renumber-windows on

# Mouse: click en tab de la barra para cambiar, click en panel para foco,
# scroll para historial, drag en borde para resize
set -g mouse on

# Historial largo + respuesta rapida de Escape (nvim dentro de tmux)
set -g history-limit 100000
set -sg escape-time 0

set -g status-style "bg=default,fg=#777777"
set -g status-left ""
set -g status-right ""
set -g status-justify left
set -g status-left-length 0
set -g status-right-length 0

set -g window-status-format "#[fg=#555555]#I:#W "
set -g window-status-current-format "#[fg=#ffffff,bold]#I:#W "
set -g window-status-separator ""

set -g pane-border-style "fg=#333333"
set -g pane-active-border-style "fg=#777777"
