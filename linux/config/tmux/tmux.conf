# ── Prefix: C-a (home row izq en Dvorak) ──
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── Shell: login shell para cargar .bashrc (zoxide, starship, etc.) ──
set -g default-command "${SHELL}"

# ── Base ──
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g history-limit 100000
set -sg escape-time 0
set -g focus-events on

# ── Extended keys (kitty) ──
set -g extended-keys on
set -as terminal-features '*:extkeys'

# ── Pane navigation: C-h/j/k/l (seamless con nvim) ──
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# ── Pane split: s (horizontal), v (vertical) ──
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ── Pane management ──
bind z resize-pane -Z
bind o select-pane -t :.+
bind x confirm-before -p "kill-pane? (y/n)" kill-pane

# ── Window shortcuts ──
# C-t nueva ventana (kitty no lo intercepta). C-Tab/C-S-Tab NO: kitty los atrapa.
bind -n C-t new-window
bind n next-window
bind p previous-window

# ── Copy mode (vim) ──
bind -n C-s copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard"
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi Escape send -X cancel

# ── Misc ──
bind r source-file ~/.config/tmux/tmux.conf \; display "Config recargado"
bind S command-prompt -p "Session name:" "new-session -s '%%'"
bind D confirm-before -p "Kill session? (y/n)" kill-session

# ── Status bar (minimal) ──
set -g status-style "bg=default,fg=#777777"
set -g status-left ""
set -g status-right ""
set -g status-justify left
set -g status-left-length 0
set -g status-right-length 0

set -g window-status-format "#[fg=#555555]#I:#W "
set -g window-status-current-format "#[fg=#ffffff,bold]#I:#W "
set -g window-status-separator ""

set -g pane-border-style "fg=#333333"
set -g pane-active-border-style "fg=#777777"

# ── tmux-sensible defaults ──
set -g default-terminal "tmux-256color"
set -g set-clipboard on
