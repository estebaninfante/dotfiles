#=========================
# VARIABLES GLOBALES
# =========================
autogenerated = 0
$mainMod = SUPER
$terminal = kitty
$fileManager = dolphin
$menu = ulauncher
xwayland {
  force_zero_scaling = true
}
exec-once = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'
# Environment Variables for Wayland & Electron High-DPI Scaling
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = GDK_SCALE,2

exec-once = urserver --daemon
QT_SCALE_FACTOR=1.5 /opt/resolve/bin/resolve
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/libexec/xdg-desktop-portal-hyprland & /usr/libexec/xdg-desktop-portal &
bind = , F9, exec, ~/.local/bin/tv-toggle.sh

exec-once = ~/.local/bin/tv-toggle.sh auto
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=Hyprland
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = dbus-update-activation-environment --systemd SSH_AUTH_SOCK
exec-once = /usr/libexec/polkit-gnome-authentication-agent-1

# =========================
# AUTOINICIO
# =========================
exec-once = hypridle
exec-once = waybar
exec-once = sleep 5 && libinput-gestures-setup start
exec-once = hyprpaper
exec-once = swayosd-server --top-margin=0.4 --right-margin=0.02 --orientation=vertical

device {
    name = elan06fa:00-04f3:3280-touchpad
    enabled = true
}

bind = , F10, exec, ~/.local/bin/toggle-lid.sh

# =========================
# MONITORES
# =========================
monitor = eDP-1, 2880x1800@120, 0x0, 2
monitor = HDMI-A-1, 2560x1440@144, 1440x-270, 1


cursor {
    no_hardware_cursors = 0
}

animations {
    enabled = yes

    bezier = smoothOut, 0.25, 1, 0.5, 1
    bezier = smoothIn, 0.5, 0, 0.75, 0
    bezier = smoothInOut, 0.45, 0, 0.55, 1

    animation = windows, 1, 3, smoothOut, slide
    animation = windowsIn, 1, 3, smoothOut, slide
    animation = windowsOut, 1, 2.5, smoothIn, popin 85%
    animation = border, 1, 2, default
    animation = fade, 1, 2, smoothInOut
    animation = workspaces, 1, 2.5, smoothInOut, slidefade 15%
}

# =========================
# INPUT
# =========================
input {
    kb_layout = dvk_prog
    kb_variant = basic
    kb_options = caps:super
    follow_mouse = 1
    touchpad {
        disable_while_typing = true
        tap-to-click = false
        natural_scroll = true
        scroll_factor = 0.5
    }
    sensitivity = 0
}

# =========================
# APARIENCIA (LOOK & FEEL)
# =========================
general {
    gaps_in = 8
    gaps_out = 12
    border_size = 0
    col.active_border = rgba(00000000)
    col.inactive_border = rgba(00000000)
}

decoration {
    rounding = 10
}

# =========================
# REGLAS DE VENTANAS (WINDOW RULES)
# =========================
windowrule = opacity 0.8 0.8, match:class ^(kitty)$
windowrule = workspace 10, match:class com.moonlight_stream.Moonlight
windowrule = fullscreen 1, match:class com.moonlight_stream.Moonlight
windowrule = workspace empty, match:class ^(libreoffice.*)$
windowrule = workspace empty, match:class ^(soffice.*)$
windowrule = float 1, match:class ^(swayosd-server)$
windowrule = move 1% 40%, match:class ^(swayosd-server)$
windowrule = size 8 180, match:class ^(swayosd-server)$
windowrule = border_size 0, match:class ^(swayosd-server)$
# =========================
# ATAJOS DE SISTEMA Y APPS
# =========================
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, SPACE, exec, rofi -show combi -modi "combi,drun,Archivos:~/.local/bin/rofi-file-search.sh,Scripts:~/.local/bin/rofi-scripts-launcher.sh" -combi-modes "drun,Archivos,Scripts" -show-icons
bind = $mainMod SHIFT, SPACE, exec, rofi -show Archivos -modi "Archivos:~/.local/bin/rofi-file-search.sh"
bind = $mainMod ALT, SPACE, exec, rofi -show Scripts -modi "Scripts:~/.local/bin/rofi-scripts-launcher.sh"
bind = $mainMod, A, exec, ~/.local/bin/antigravity-ui.sh
bind = $mainMod, Z, exec, firefox

bind = $mainMod, Q, killactive
bind = $mainMod, L, exec, loginctl lock-session
bind = $mainMod, F, fullscreen
bind = $mainMod, D, togglefloating
bind = $mainMod, B, togglespecialworkspace

bind = $mainMod SHIFT, R, exec, hyprctl reload
bind = $mainMod SHIFT, X, exit

# Volumen (SwayOSD)
binde = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 3%+ && swayosd-client --output-volume raise
binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 3%- && swayosd-client --output-volume lower
bind = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle

# Multimedia
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# Brillo (SwayOSD)
bind = , XF86MonBrightnessUp, exec, brightnessctl set +3% && swayosd-client --brightness raise
bind = , XF86MonBrightnessDown, exec, brightnessctl set 3%- && swayosd-client --brightness lower

# Captura de pantalla
bind = , Print, exec, grimblast copy area
bind = SHIFT, Print, exec, grimblast copy screen
bind = CTRL, Print, exec, grimblast save area

# =========================
# FOCUS
# =========================
bind = $mainMod, O, movefocus, l
bind = $mainMod, U, movefocus, r
bind = $mainMod, Ñ, movefocus, u
bind = $mainMod, E, movefocus, d

# =========================
# MOVER VENTANAS
# =========================
bind = $mainMod SHIFT, O, movewindow, left
bind = $mainMod SHIFT, U, movewindow, right
bind = $mainMod SHIFT, Ñ, movewindow, up
bind = $mainMod SHIFT, E, movewindow, down

# =========================
# REDIMENSIONAR
# =========================
bind = $mainMod, left, resizeactive, -20 0
bind = $mainMod, right, resizeactive, 20 0
bind = $mainMod, up, resizeactive, 0 -20
bind = $mainMod, down, resizeactive, 0 20

# =========================
# ESCRITORIOS (WORKSPACES)
# =========================
bind = $mainMod, M, workspace, 1
bind = $mainMod, W, workspace, 2
bind = $mainMod, V, workspace, 3
bind = $mainMod, H, workspace, 4
bind = $mainMod, T, workspace, 5
bind = $mainMod, N, workspace, 6
bind = $mainMod, G, workspace, 7
bind = $mainMod, C, workspace, 8
bind = $mainMod, R, workspace, 9
bind = $mainMod, S, workspace, 10

bind = $mainMod SHIFT, M, movetoworkspace, 1
bind = $mainMod SHIFT, W, movetoworkspace, 2
bind = $mainMod SHIFT, V, movetoworkspace, 3
bind = $mainMod SHIFT, H, movetoworkspace, 4
bind = $mainMod SHIFT, T, movetoworkspace, 5
bind = $mainMod SHIFT, N, movetoworkspace, 6
bind = $mainMod SHIFT, G, movetoworkspace, 7
bind = $mainMod SHIFT, C, movetoworkspace, 8
bind = $mainMod SHIFT, R, movetoworkspace, 9
bind = $mainMod SHIFT, S, movetoworkspace, 10

# =========================
# MODO MOONLIGHT (Toggle)
# =========================
bindl = CTRL, Delete, exec, ~/.local/bin/toggle_moonlight.sh

submap = passthrough
bindl = CTRL, Delete, exec, ~/.local/bin/toggle_moonlight.sh
submap = reset
