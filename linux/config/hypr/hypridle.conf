# Suspensión por inactividad.
#
# Omarchy (omarchy-shell) ya se encarga del protector de pantalla y del bloqueo
# (idle.screensaver / idle.lock en ~/.config/omarchy/shell.json). Hypridle solo
# agrega lo que Omarchy no hace: suspender la máquina.
#
# - Con batería: suspende a los 10 minutos de inactividad.
# - Con corriente: espera 30 minutos, pero también suspende.
#
# idle-suspend respeta el toggle "Stay Awake" de la barra
# (~/.local/state/omarchy/indicators/stay-awake): si está activo, no suspende.
#
# Los inhibidores de idle se respetan por defecto, así que un video en
# pantalla completa o una app que pide no dormir mantienen la máquina despierta.

general {
    # Al volver de suspensión NADIE encendía la pantalla: el bloqueo la apaga por
    # DPMS a los 5s de bloquear y el único despertar era un click o una tecla
    # sobre la pantalla de bloqueo. Resultado: al abrir la tapa la pantalla
    # seguía negra hasta que tocabas algo (y la primera tecla solo despertaba).
    # `omarchy-system-wake` prende DPMS, restaura el brillo del teclado y
    # reconcilia clamshell; es exactamente lo que hace el click.
    # al-despertar: repara el micrófono (PipeWire sin audio tras s2idle) y la visión.
    after_sleep_cmd = omarchy-system-wake; $HOME/.local/bin/al-despertar &
}

listener {
    timeout = 600                                 # 10 min, solo si está con batería
    on-timeout = idle-suspend --battery-only
}

listener {
    timeout = 1800                                # 30 min, siempre (con AC)
    on-timeout = idle-suspend
}
