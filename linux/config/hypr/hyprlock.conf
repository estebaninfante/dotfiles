$font = Monospace

general {
    hide_cursor = false
}

auth {
    fingerprint {
        enabled = true
        ready_message = Escanea tu huella para desbloquear
        present_message = Escaneando...
        retry_delay = 250
    }
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    color = rgba(0, 0, 0, 0.5)
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(128, 128, 128, 0.5)
    outer_color = rgba(ff3333ee) rgba(cc0000ee) 45deg
    check_color = rgba(00ff99ee) rgba(ff6633ee) 120deg
    fail_color = rgba(ff6633ee) rgba(ff0066ee) 40deg
    font_color = rgb(255, 255, 255)
    fade_on_empty = false
    rounding = 15
    font_family = $font
    placeholder_text = Contraseña...
    fail_text = $PAMFAIL
    dots_color = rgb(255, 255, 255)
    dots_spacing = 0.3
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 90
    font_family = $font
    position = -30, 0
    halign = right
    valign = top
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 25
    font_family = $font
    position = -30, -150
    halign = right
    valign = top
}

label {
    monitor =
    text = $FPRINTPROMPT
    color = rgba(200, 200, 200, 1.0)
    font_size = 14
    font_family = $font
    position = 0, -110
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:5000] cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -n 1 | awk '{print $1"%"}'
    color = rgba(200, 200, 200, 1.0)
    font_size = 16
    font_family = $font
    position = 30, 30
    halign = left
    valign = bottom
}
