# Fondo propio por monitor, aparte del wallpaper canónico de Omarchy.
#
# Formato: <salida> = <ruta absoluta>
#
# Los monitores que no aparecen acá siguen el fondo canónico (el symlink que
# escribe `omarchy theme bg set`). Lo lee sync-wallpaper.sh y lo aplica a las dos
# superficies: hyprpaper (escritorio) y el backdrop del overview de hyprexpo
# (grilla). Así cada pantalla pinta su mismo archivo en escritorio y grilla, en
# vez de que la grilla muestre el fondo de la otra pantalla.
#
# Las salidas son las de `hyprctl monitors` (HDMI-A-1, DP-2, ...).
HDMI-A-1 = /home/eztvn/dotfiles/linux/config/hypr/wallpapers/nature-future.png
