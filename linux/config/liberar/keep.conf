# liberar — procesos que NUNCA se cierran.
#
# Un patrón por línea (regex, se compara contra la línea de comandos y contra
# el nombre del ejecutable). '#' al inicio = comentario.
#
# 'liberar' ya respeta todo lo que arrancó junto con la máquina o con el login;
# esta lista es sobre todo para 'liberar -s' (bajar también los servicios de
# usuario) y para proteger cosas que abriste vos y querés conservar.

# --- systemd de usuario y sesión gráfica ---
^systemd
\(sd-pam\)
dbus-broker
sddm-helper
uwsm
wayland-wm
wayland-session
^Hyprland
^Xwayland
^hyprpaper
^hypridle
^hyprlock
hyprpolkitagent
^quickshell
^omarchy-
^omar-pill
^ohm
^gvfsd
^xdg-
^at-spi
gnome-keyring
^dconf
speech-dispatcher

# --- audio / video del escritorio ---
^pipewire
^wireplumber
^pw-
^parec
^cava

# --- teclado, ratón y accesorios de la sesión ---
^fcitx5
^keyd
^kanata
^ydotoold
^lan-mouse
^nm-applet
^blueman-applet
^inotifywait
^wl-paste

