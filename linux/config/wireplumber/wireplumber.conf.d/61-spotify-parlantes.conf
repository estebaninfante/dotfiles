# Spotify siempre por los parlantes (placa analógica), aunque la salida por
# defecto sea otra: así la voz del asistente puede ir por el audífono Bluetooth
# y la música no se mezcla con ella.
stream.rules = [
  {
    matches = [ { application.name = "Spotify" } ]
    actions = { update-props = { target.object = "alsa_output.pci-0000_05_00.6.analog-stereo" } }
  }
]
