# El Mpow M5 falla en "manos libres" cuando WirePlumber elige mSBC: la
# conexión de audio no se establece y PipeWire deja de arrancar cualquier
# stream (ni el micrófono interno graba; hay que reiniciar el audio).
# Con mSBC apagado el manos libres usa CVSD, que sí conecta: su micrófono se
# puede usar (el auricular baja a mono 8 kHz mientras dura la grabación).
monitor.bluez.properties = {
  bluez5.enable-msbc = false
}
