# El Mpow M5 usa su micrófono solo en modo "manos libres" (HFP, audio por
# SCO). En este equipo el SCO y el cambio automático de perfil de WirePlumber
# rompen el grafo de audio, así que el cambio se hace a mano con
# `audio-bt-mic` (fila "Micrófono del auricular" del panel de volumen):
#   - mSBC apagado: con mSBC el transporte de este auricular falla; CVSD sí anda.
#   - autoswitch apagado: WirePlumber ya no cambia A2DP <-> HFP solo (eso era
#     lo que dejaba el audio trabado); el panel lo cambia cuando lo pedís.
monitor.bluez.properties = {
  bluez5.enable-msbc = false
}
wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
}
