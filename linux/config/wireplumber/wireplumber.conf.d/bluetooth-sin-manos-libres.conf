# El Mpow M5 no puede usar su micrófono en esta máquina: el modo "manos
# libres" (HFP) manda el audio por SCO y el controlador Bluetooth lo entrega
# corrupto (kernel: "corrupted SCO packet" / "SCO packet for unknown
# connection handle"), el transporte falla y PipeWire se traba entero: deja de
# grabar hasta el micrófono interno y hay que reiniciar el audio.
#
# Sin roles HFP/HSP el auricular solo ofrece A2DP (música) y el micrófono que
# se usa es el interno. Para volver atrás, borrar bluez5.roles (vuelven los
# roles por defecto de WirePlumber).
monitor.bluez.properties = {
  bluez5.roles = [ a2dp_sink a2dp_source ]
}
wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
}
