# El Mpow M5 y el controlador Bluetooth de esta laptop (MediaTek MT7922) no se
# llevan en "manos libres": el SCO (audio de HFP, el que lleva el micrófono del
# auricular) llega corrupto al kernel ("corrupted SCO packet" / "unknown
# connection handle") y PipeWire entrega silencio. Probado con CVSD y con
# mSBC, y también forzando el SCO desde el parlante del auricular: el
# micrófono nunca entrega audio. Por eso, al elegirlo, además se trababa todo.
#
# Queda el cambio de perfil manual (script audio-bt-mic) para cuando haya un
# adaptador Bluetooth que sí haga SCO, y el autoswitch apagado para que
# WirePlumber no cambie de perfil solo y trabe el audio.
monitor.bluez.properties = {
  bluez5.enable-msbc = false
}
wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
}
