# Deja que el mixer de hardware de la placa de audio quede fijo y que el
# volumen lo maneje PipeWire en software. Sin esto, WirePlumber fuerza el
# "Capture" del micrófono interno al 100% (+30 dB) y el "Internal Mic Boost"
# al máximo, y el micrófono satura (siempre en rojo).
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.pci-0000_05_00.6" }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
      }
    }
  }
]
