# Los navegadores basados en Chromium crean, además del stream principal de
# audio, uno interno mono (voice engine) que se mutea solo cuando no hay nada
# sonando. WirePlumber guarda el estado por `application.name`, así que ese
# mute "pisa" el del audio principal: cada stream nuevo de Brave/Chromium
# nacía muteado y no se escuchaba nada, aunque el volumen estuviera al 100%.
#
# Acá desactivamos el restore de propiedades SOLO para los navegadores: cada
# stream arranca siempre sin mute, al volumen por defecto. El resto de las
# apps siguen recordando su volumen con normalidad.
stream.rules = [
  {
    matches = [
      { application.name = "~.*[Bb]rave.*" }
      { application.name = "~.*hromium.*" }
      { application.name = "~.*Chrome.*" }
      { application.process.binary = "~brave.*" }
      { application.process.binary = "~chromium.*" }
      { application.process.binary = "~chrome.*" }
    ]
    actions = {
      update-props = {
        state.restore-props = false
      }
    }
  }
]
