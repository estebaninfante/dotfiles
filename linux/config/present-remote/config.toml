# Mapeo de gestos del control de presentaciones (SHARKOON "Wireless Present").
#
# El control tiene 4 botones físicos: 3 útiles + el láser (no emite nada).
# El botón del "cuadrito" es INTELIGENTE: el propio control distingue el gesto
# y manda códigos distintos (por eso la config usa teclas distintas, no cuenta
# toques):
#
#   1 toque    -> Tab   -> f14
#   2 toques   -> Enter -> f17
#   mantener   -> Alt+Tab (repite) -> f18 (el Alt) [los Tab se ignoran]
#
# present-remote lee `keyd monitor` y ejecuta el comando de cada gesto.
# Editá este archivo y reiniciá:  systemctl --user restart present-remote
#
# Claves de un botón:
#   tap / double / triple / hold  = comandos por gesto (shell; con `@` son internas)
#   combo_with + combo            = este botón espera `combo_ms`; si llega
#                                   `combo_with`, corre `combo` (ej.: 2+1 = 3 toques)
#   suppress                      = mientras este botón está apretado, ignora esas teclas
#
# Acciones internas:
#   @voice   toggle de Omar (prende/apaga)
#   @arrow prev|next   flecha contextual (terminal->tmux, otro->scroll)
#   @enter   manda Enter
#   @cancel  corta la sesión de voz
#
# Doble toque en las flechas:
#   flecha izq (1 toque) -> repetir el último mensaje (reinicia el que suena)
#   flecha der x2 -> nueva terminal (kitty) con pi cargado y enfocado

[settings]
hold_ms = 600        # ms para el gesto `hold`
multi_gap_ms = 320   # ventana entre toques (para botones que cuentan toques)
combo_ms = 600       # ventana para encadenar combos (ej. Enter + Tab = triple)
cancel_key = "esc"   # tecla que cancela la sesión de voz activa ("" = desactivado)

# ── Botón del cuadrito (inteligente: Tab / Enter / Alt+Tab) ──────────────
# 1 toque (Tab -> f14): toggle de Omar
[buttons.f14]
tap = "@voice"

# 2 toques (Enter -> f17): dictado de OmniVoz. Y 2+1 (Enter+Tab) = 3 toques -> launcher.
[buttons.f17]
tap = "~/.local/bin/omnivoz dictate"
combo_with = "f14"
combo = "omarchy-menu toggle"

# mantener (Alt -> f18): alterna Hyprexpo (Súper+Y). Ojo: el layout es Dvorak,
# asi que la "y" esta en la posicion fisica de la T (keycode 20), no 21.
# Mientras se mantiene, ignora los Tab repetidos.
[buttons.f18]
hold = "ydotool key 125:1 20:1 20:0 125:0"
suppress = ["f14", "f17"]

# ── Flechas ──────────────────────────────────────────────────────────────
# Flecha izquierda: UN solo toque -> repetir el último mensaje (si está
# sonando, lo reinicia desde el principio).
# (El hold-resultaba poco confiable en este control, que a veces manda dos
# pulsos por toque.)
[buttons.f15]
tap = "voice repeat --restart"

# Flecha derecha: siguiente. Doble -> terminal nueva con pi.
[buttons.f16]
tap = "@arrow next"
double = "pi-new"
