[settings]
body_enabled = false
onnx_threads = 8
fps = 30
face_every = 1
body_every = 10
camera = 0
dwell_ms = 200

[[poses]]
name = "FIST"
thumb = false
index = false
middle = false
ring = false
pinky = false

[[poses]]
name = "FIVE"
thumb = true
index = true
middle = true
ring = true
pinky = true

[[poses]]
name = "SIGN"
thumb = true
index = true
middle = false
ring = false
pinky = true

[[poses]]
name = "THUMBS_UP"
thumb = true
index = false
middle = false
ring = false
pinky = false

[[poses]]
name = "FOUR"
thumb = false
index = true
middle = true
ring = true
pinky = true

[[poses]]
name = "THREE"
thumb = true
index = true
middle = true
ring = false
pinky = false

[[poses]]
name = "TWO"
thumb = false
index = true
middle = true
ring = false
pinky = false

[[poses]]
name = "ONE"
thumb = false
index = true
middle = false
ring = false
pinky = false

[[poses]]
name = "L"
thumb = true
index = true
middle = false
ring = false
pinky = false

[[bindings]]
name = "tag_cycle"
require = [{hand = "left", pose = "THREE"}]
trigger = { type = "continuous", hand = "left", metric = "pinch_distance", range = [0.15, 0.3] }

[[bindings]]
name = "set_volume"
require = [{hand = "left", pose = "L"}]
trigger = { hand = "left", metric = "pinch_distance", range = [0, 0.6], type = "continuous" }

[[bindings]]
name = "stack_cycle"
require = [{hand = "right", pose = "THREE"}]
trigger = { type = "continuous", hand = "right", metric = "pinch_distance", range = [0.15, 0.3] }

[[bindings]]
name = "play_pause"
trigger = { hand = "left", step_dwell_ms = 5, steps = ["FIVE", "FOUR"], type = "sequence", window_ms = 1500 }

[[bindings]]
name = "browser_back"
trigger = { type = "swipe", hand = "right", direction = "left", min_displacement = 0.15 }

# Example: require either hand to hold FIST as a modifier for a swipe
# [[bindings]]
# name = "mode_switch"
# require = [{hand = "either", pose = "FIST"}]
# trigger = { type = "swipe", hand = "right", direction = "left" }



# ── Workspaces Hyprland (swipe) ──────────────────────────────────────────────
[[bindings]]
name = "workspace_next"
trigger = { type = "swipe", hand = "right", direction = "right", min_displacement = 0.15 }

[[bindings]]
name = "workspace_prev"
trigger = { type = "swipe", hand = "right", direction = "left", min_displacement = 0.15 }



# ── Cambio de modo SIN teclado (siempre activos, una mano por modo) ──────────
# Mano izq SIGN → modo 3D (modelado) | mano der SIGN → modo PC (navegación)
[[bindings]]
name = "mode_3d"
modes = ["pc", "3d"]
no_suppress = true
trigger = { type = "pose", hand = "left", shape = "SIGN", dwell_ms = 350 }

[[bindings]]
name = "mode_pc"
modes = ["pc", "3d"]
no_suppress = true
trigger = { type = "pose", hand = "right", shape = "SIGN", dwell_ms = 350 }


# Presencia: apaga pantalla al irte (sin cara ni movimiento), enciende al volver.
[presence]
enabled = true
idleSeconds = 25
useFace = true
useMotionDetection = true
motionThreshold = 5.0
checkHz = 2
pauseModelsWhenAbsent = true
