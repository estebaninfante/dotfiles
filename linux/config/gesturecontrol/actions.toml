# Continuous triggers can have an onEnd handler that fires when the trigger ends
# [[bindings]]
# signal = "set_volume"
# action = { type = "exec", cmd = ["playerctl", "set-volume", "{value}"] }
# onEnd = { type = "exec", cmd = ["notify-send", "Volume control ended"] }

# ── Workspaces Hyprland (swipe) ──────────────────────────────────────────────
[[bindings]]
signal = "workspace_next"
action = { type = "exec", cmd = ["hyprctl", "dispatch", 'hl.dsp.focus({ workspace = "e+1" })'] }

[[bindings]]
signal = "workspace_prev"
action = { type = "exec", cmd = ["hyprctl", "dispatch", 'hl.dsp.focus({ workspace = "e-1" })'] }

# ── Cambio de modo (gesto) ──────────────────────────────────────────────────
[[bindings]]
signal = "mode_3d"
action = { type = "exec", cmd = ["/home/eztvn/.local/share/gesturecontrol/gesturecontrol-mode", "3d"] }

[[bindings]]
signal = "mode_pc"
action = { type = "exec", cmd = ["/home/eztvn/.local/share/gesturecontrol/gesturecontrol-mode", "pc"] }

# ── Handy: dictado/post-process con un gesto ─────────────────────────────────
[[bindings]]
signal = "handy_toggle"
action = { type = "exec", cmd = ["handy", "--toggle-post-process"] }
